<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light only">
  <meta name="description" content="مواضيع الاختبارات والتصحيحات النموذجية للأقسام">
  <title>تصحيح الاختبارات</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="#/" class="brand" aria-label="الصفحة الرئيسية">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 12.5l4 4L18 8.5"/></svg>
        </span>
        <span class="brand-text">
          <strong id="site-title">تصحيح الاختبارات</strong>
          <small id="site-sub"></small>
        </span>
      </a>
      <label class="year-picker">
        <span class="sr-only">السنة الدراسية</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <select id="year-select" aria-label="السنة الدراسية"></select>
      </label>
    </div>
  </header>

  <main id="app" class="wrap" tabindex="-1"></main>

  <footer class="footer">
    <div class="wrap" id="footer-text"></div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
